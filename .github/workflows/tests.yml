name: Test Suite & Quality Gates

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-cov jsonschema pandas scikit-learn

      - name: Validate Synthetic Schemas
        run: |
          python scripts/data/generate_synthetic_data.py --output-dir data/synthetic/sample_data
          python scripts/data/validate_dataset.py --data data/synthetic/sample_data/synthetic_medicines.csv --schema data/schemas/medicine_schema.json
          python scripts/data/validate_dataset.py --data data/synthetic/sample_data/synthetic_inventory.csv --schema data/schemas/inventory_schema.json
          python scripts/data/validate_dataset.py --data data/synthetic/sample_data/synthetic_batches.csv --schema data/schemas/batch_schema.json

      - name: Run Test Suite
        run: pytest tests/ -v --maxfail=5
